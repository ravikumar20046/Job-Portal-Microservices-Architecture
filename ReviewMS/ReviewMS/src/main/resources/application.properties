# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reviewDB
spring.datasource.username=postgres
spring.datasource.password=9716
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


#Resilience 4J
# Company Service Circuit Breaker
resilience4j.circuitbreaker.instances.companyService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.companyService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.companyService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.companyService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.companyService.permittedNumberOfCallsInHalfOpenState=2

# Review Service Circuit Breaker
resilience4j.circuitbreaker.instances.reviewService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reviewService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.reviewService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.reviewService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.reviewService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reviewService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.reviewService.permittedNumberOfCallsInHalfOpenState=2

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true